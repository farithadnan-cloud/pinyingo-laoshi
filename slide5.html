      utter.rate = audioRate;
      utter.pitch = 1.0;

      const zhVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('cmn'));

      window.speechSynthesis.speak(utter);

              <div class="border-b border-slate-800 pb-3 mb-5">
                <span class="text-xs font-black uppercase tracking-wider text-indigo-400">${slide.tag}</span>
                <h2 class="text-xl sm:text-2xl font-outfit font-black text-white">${slide.title}</h2>
              </div>

              <div class="space-y-4">
                ${slide.patterns.map((p, idx) => `
                  <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4 sm:p-5 shadow-md">
                    <div class="flex items-center justify-between mb-1.5">
                      <span class="text-xs font-black text-cyan-400 bg-cyan-950/70 px-2.5 py-0.5 rounded-full border border-cyan-800/60">
                        Pola ${idx + 1}
                      </span>
                      <span class="text-xs text-slate-400">${p.explain}</span>
                    </div>
                    <div class="text-sm sm:text-base font-bold font-mono text-indigo-200 bg-slate-900/90 px-3 py-2 rounded-xl border border-slate-700/80 my-2">
                      ${p.formula}
                    </div>
                    <!-- Example with Pronounce button -->
                    <div class="flex items-center justify-between bg-slate-900/50 p-2.5 rounded-xl border border-slate-800">
                      <div>
                        <div class="font-hanzi text-lg sm:text-xl font-bold text-white flex items-center space-x-2">
                          <span>${p.exampleHz}</span>
                          <span class="text-xs font-sans text-cyan-400 font-semibold">(${p.examplePy})</span>
                        </div>
                        <div class="text-xs text-slate-400 mt-0.5">${p.exampleMy}</div>
                      </div>
                      <button onclick="speakChinese('${p.exampleHz}')" class="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center space-x-1 active:scale-95 transition shadow-sm">
                        <span>🔊</span><span>Sebut Ayat</span>
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        } else if (slide.type === 'dialogue') {
          contentHtml = `
            <div>
              <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                <div>
                  <span class="text-xs font-black uppercase tracking-wider text-indigo-400">${slide.tag}</span>
                  <h2 class="text-xl sm:text-2xl font-outfit font-black text-white">${slide.title}</h2>
                </div>
                <button onclick="playAllDialogue()" class="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center space-x-1.5 active:scale-95 transition shadow-md shadow-indigo-900/40">
                  <span>▶️</span><span>Mainkan Semua Dialog</span>
                </button>
              </div>

              <!-- Dialogue Lines -->
              <div class="space-y-3">
                ${slide.lines.map((l, lIdx) => `
                  <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3.5 sm:p-4 flex items-center justify-between hover:border-slate-600 transition group">
                    <div class="flex items-center space-x-3.5">
                      <div class="w-10 h-10 rounded-2xl bg-indigo-900/60 border border-indigo-700/60 text-indigo-300 flex items-center justify-center font-bold text-xs shrink-0">
                        ${l.speaker.split(' ')[0]}
                      </div>
                      <div>
                        <div class="text-[11px] font-bold text-indigo-400">${l.speaker}</div>
                        <div class="font-hanzi text-lg sm:text-xl font-bold text-white group-hover:text-cyan-300 transition">
                          ${l.hz}
                        </div>
                        <div class="text-xs font-semibold text-cyan-400">${l.py}</div>
                        <div class="text-xs text-slate-400 mt-0.5">${l.my}</div>
                      </div>
                    </div>
                    <button onclick="speakChinese('${l.hz}')" class="w-9 h-9 rounded-xl bg-slate-700 group-hover:bg-indigo-600 text-slate-200 group-hover:text-white flex items-center justify-center text-sm font-bold transition shrink-0 ml-3 active:scale-90" title="Dengar sebutan baris ini">
                      🔊
                    </button>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        } else if (slide.type === 'class_activity') {
          contentHtml = `
            <div>
              <div class="border-b border-slate-800 pb-3 mb-4">
                <span class="text-xs font-black uppercase tracking-wider text-emerald-400">${slide.tag}</span>
                <h2 class="text-xl sm:text-2xl font-outfit font-black text-white">${slide.title}</h2>
                <p class="text-xs text-slate-400 mt-0.5">Guru menanyakan soalan kepada murid, kemudian tekan butang untuk mendedahkan jawapan tepat.</p>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                ${slide.questions.map((item, qIdx) => `
                  <div class="bg-slate-800/80 border border-slate-700/90 rounded-2xl p-4 flex flex-col justify-between shadow-md">
                    <div class="font-bold text-white text-sm sm:text-base mb-3 leading-snug">
                      ${item.q}
                    </div>
                    <div>
                      <div id="ans-box-${qIdx}" class="hidden p-2.5 rounded-xl bg-emerald-950/70 border border-emerald-700/60 text-emerald-300 text-xs sm:text-sm font-bold font-hanzi mb-2">
                        💡 Jawapan: ${item.a}
                      </div>
                      <button onclick="toggleAnswer(${qIdx})" id="ans-btn-${qIdx}" class="w-full py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold transition active:scale-95">
                        👁️ Dedahkan Jawapan
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        } else if (slide.type === 'summary') {
          contentHtml = `
            <div class="flex flex-col items-center justify-center text-center my-auto py-6">
              <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white text-3xl font-black shadow-xl shadow-emerald-900/40 mb-4 animate-bounce">
                🎉
              </div>
              <span class="text-xs font-black uppercase tracking-wider text-emerald-400 mb-1">${slide.tag}</span>
              <h2 class="text-3xl sm:text-4xl font-outfit font-black text-white mb-6">${slide.title}</h2>

              <div class="w-full max-w-xl bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 text-left mb-6 shadow-md">
                <div class="text-xs font-extrabold text-slate-300 uppercase tracking-wider mb-2.5">
                  📌 KESIMPULAN SESI PEMBELAJARAN HARI INI:
                </div>
                <ul class="space-y-2 text-xs sm:text-sm text-slate-300">
                  ${slide.points.map(pt => `
                    <li class="flex items-start space-x-2">
                      <span class="text-emerald-400 font-bold">✓</span>
                      <span>${pt}</span>
                    </li>
                  `).join('')}
                </ul>
              </div>

              <!-- CTA: Launch Student Self-Learn App -->
              <div class="flex flex-wrap items-center justify-center gap-3">
                <a href="${slide.selfLearnUrl}" class="h-11 px-6 rounded-2xl bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-600 hover:from-emerald-500 hover:to-cyan-500 text-white font-extrabold text-sm flex items-center space-x-2 shadow-lg shadow-emerald-900/40 active:scale-95 transition">
                  <span>📱</span>
                  <span>Mula Latihan Kendiri Murid (20 Soalan & Suara)</span>
                </a>
                <button onclick="goToSlide(0)" class="h-11 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-sm border border-slate-700 active:scale-95 transition">
                  🔄 Ulang Slaid Dari Mula
                </button>
              </div>
            </div>
          `;
        }

        viewport.innerHTML = contentHtml;
        viewport.classList.remove('slide-enter');
        viewport.classList.add('slide-active');
      }, 80);
    }

    function nextSlide() {
      if (currentSlideIdx < SLIDES.length - 1) {
        currentSlideIdx++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlideIdx > 0) {
        currentSlideIdx--;
        renderSlide();
      }
    }

    function goToSlide(idx) {
      if (idx >= 0 && idx < SLIDES.length) {
        currentSlideIdx = idx;
        renderSlide();
      }
    }

    function toggleAnswer(idx) {
      const box = document.getElementById(`ans-box-${idx}`);
      const btn = document.getElementById(`ans-btn-${idx}`);
      if (box.classList.contains('hidden')) {
        box.classList.remove('hidden');
        btn.textContent = "🙈 Sembunyikan Jawapan";
        btn.classList.add('bg-slate-800');
      } else {
        box.classList.add('hidden');
        btn.textContent = "👁️ Dedahkan Jawapan";
        btn.classList.remove('bg-slate-800');
      }
    }

    function playAllDialogue() {
      const slide = SLIDES[currentSlideIdx];
      if (slide.type !== 'dialogue') return;
      let lineIndex = 0;
      function speakNext() {
        if (lineIndex < slide.lines.length) {
          const l = slide.lines[lineIndex];
          speakChinese(l.hz);
          lineIndex++;
          setTimeout(speakNext, 3200);
        }
      }
      speakNext();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      } else if (e.key.toLowerCase() === 'h') {
        window.location.href = 'index.html';
      }
    });

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      renderSlide();
    });
  </script>
</body>
</html>
