    function speakChinese(text, role) {
      if (!window.speechSynthesis) {
        alert("Pelayar anda tidak menyokong Speech Synthesis.");
        return;
      }
      window.speechSynthesis.cancel();
      
      const clean = text.replace(/[\(（].*?[\)）]/g, '').trim();
      if (!clean) return;

      const utter = new SpeechSynthesisUtterance(clean);
      utter.lang = 'zh-CN';
      utter.rate = audioRate;

      if (zhVoices.length === 0) initVoices();

      // Role differentiation: Male vs Female
      const roleStr = String(role || '').toLowerCase();
      const isMale = (role === 'A' || role === 'male' || roleStr.includes('老板') || roleStr.includes('服务员') || roleStr.includes('李强') || roleStr.includes('大伟') || roleStr.includes('经理') || roleStr.includes('watak a'));

      // Male & Female Voice Differentiation (tested for Edge, Chrome & generic TTS)
      const maleVoiceNames = ['yunxi', 'yunyang', 'yunjian', 'kangkang', 'zhiwei', 'danny', 'wanlung', 'benson', 'male', 'boy', 'man', 'david'];
      const femaleVoiceNames = ['xiaoxiao', 'xiaoyi', 'huihui', 'yaoyao', 'hiugaai', 'female', 'girl', 'zira', 'hsiaochen'];

      if (isMale) {
        let mVoice = zhVoices.find(v => maleVoiceNames.some(m => v.name.toLowerCase().includes(m)));
        if (mVoice) {
          utter.voice = mVoice;
          utter.pitch = 0.75;
          utter.rate = audioRate * 0.90;
        } else {
          // Pitch 0.45 forces any standard voice into a deep, booming male register
          if (zhVoices.length > 0) utter.voice = zhVoices[0];
          utter.pitch = 0.45;
          utter.rate = audioRate * 0.88;
        }
      } else if (isFemale) {
        let fVoice = zhVoices.find(v => femaleVoiceNames.some(f => v.name.toLowerCase().includes(f)));

          utter.pitch = 1.25;

        utter.pitch = 1.0;

                <button id="rf-pinyin" onclick="togglePinyinRoleplay()" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 font-bold text-xs transition">
                  👁️ Sembunyi Pinyin
                </button>
                <button id="rf-my-rp" onclick="toggleBmTranslation()" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-bold text-xs transition flex items-center space-x-1 shadow">
                  <span>👁️ Tunjuk Maksud BM</span>
                </button>
              </div>
            </div>

            <!-- Role Badges (Watak A = Lelaki (BIRU), Watak B = Perempuan (PINK)) -->
            <div class="grid grid-cols-2 gap-3 mb-3">
              <div class="p-3 rounded-2xl bg-blue-950/80 border-2 border-blue-500 flex items-center space-x-3 shadow-lg shadow-blue-500/20">
                <div class="w-8 h-8 rounded-full bg-blue-600 text-white font-black text-sm flex items-center justify-center shrink-0 ring-2 ring-blue-400 shadow">
                  A
                </div>
                <div>
                  <div class="text-[10px] font-black uppercase tracking-wider text-blue-300">Watak A • 👨 Suara Lelaki (Kumpulan Kiri)</div>
                  <div class="text-sm font-black text-white">${slide.speakerA}</div>
                </div>
              </div>

              <div class="p-3 rounded-2xl bg-pink-950/80 border-2 border-pink-500 flex items-center space-x-3 shadow-lg shadow-pink-500/20">
                <div class="w-8 h-8 rounded-full bg-pink-600 text-white font-black text-sm flex items-center justify-center shrink-0 ring-2 ring-pink-400 shadow">
                  B
                </div>
                <div>
                  <div class="text-[10px] font-black uppercase tracking-wider text-pink-300">Watak B • 👩 Suara Perempuan (Kumpulan Kanan)</div>
                  <div class="text-sm font-black text-white">${slide.speakerB}</div>
                </div>
              </div>
            </div>

            <!-- Dialogue Lines Container -->
            <div class="space-y-3 flex-1 overflow-y-auto custom-scrollbar pr-2 max-h-[380px]">
              ${slide.dialogues.map((dlg, dIdx) => `
                <div class="mb-3">
                  <div class="text-xs font-black text-amber-400 uppercase tracking-wide mb-2 px-1">
                    ${dlg.title || `Bahagian ${dIdx + 1}`}
                  </div>
                  <div class="space-y-2.5">
                    ${dlg.lines.map((l, lIdx) => {
                      const isA = (lIdx % 2 === 0);
                      const role = isA ? 'A' : 'B';
                      const roleVoice = isA ? 'male' : 'female';
                      return `
                        <div id="rp-line-${dIdx}-${lIdx}" class="rp-line rp-role-${role} p-3 rounded-2xl ${isA ? 'bg-blue-950/50 border-2 border-blue-500/80 hover:border-blue-400 shadow-blue-950/40' : 'bg-pink-950/50 border-2 border-pink-500/80 hover:border-pink-400 shadow-pink-950/40'} flex items-center justify-between shadow-md transition-all">
                          <div class="flex items-start space-x-3">
                            <span class="w-7 h-7 rounded-full ${isA ? 'bg-blue-600 ring-2 ring-blue-400' : 'bg-pink-600 ring-2 ring-pink-400'} text-white font-black text-xs flex items-center justify-center shrink-0 mt-0.5 shadow">
                              ${role}
                            </span>
                            <div>
                              <div class="text-[11px] font-black ${isA ? 'text-blue-300' : 'text-pink-300'} mb-0.5">
                                ${l.speaker} (${isA ? '👨 Suara Lelaki' : '👩 Suara Perempuan'})
                              </div>
                              <div class="text-base sm:text-lg font-black font-hanzi text-white">${l.hz}</div>
                              <div class="rp-pinyin text-xs font-mono ${isA ? 'text-blue-200' : 'text-pink-200'} font-bold">${l.py}</div>
                              <div class="rp-my text-xs text-slate-300 mt-1.5 p-2 rounded-xl bg-slate-900/80 border border-slate-700/80" style="display: none;">🎯 ${l.my}</div>
                            </div>
                          </div>

                          <button onclick="playDialogueAudio(${slide.topic_num || topic_num}, ${dIdx}, ${lIdx}, '${l.hz}', '${roleVoice}')" class="p-2.5 rounded-xl ${isA ? 'bg-blue-900/80 hover:bg-blue-600 border border-blue-400 text-blue-200 hover:text-white' : 'bg-pink-900/80 hover:bg-pink-600 border border-pink-400 text-pink-200 hover:text-white'} transition shrink-0 ml-3 shadow-md" title="Mainkan sebutan (${isA ? 'Suara Lelaki' : 'Suara Perempuan'})">
                            🔊
                          </button>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 12. UJI KEFAHAMAN DIALOG (6 SOALAN, HANZI + PINYIN SAHAJA, NO BM)
      else if (slide.type === 'dialogue_comprehension') {
        contentHtml = `
          <div>
            <div class="border-b border-slate-800 pb-2 mb-3">
              <span class="text-xs font-black uppercase tracking-wider text-sky-400">${slide.tag}</span>
              <h2 class="text-lg sm:text-xl font-outfit font-black text-white">${slide.title}</h2>
              <p class="text-xs text-slate-400 mt-0.5">${slide.subtitle}</p>
            </div>

            <!-- 6 COMPREHENSION QUESTIONS (Hanzi + Pinyin ONLY, NO BM) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[460px] overflow-y-auto pr-2 custom-scrollbar">
              ${slide.questions.map((q, qIdx) => `
                <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-3.5 flex flex-col justify-between shadow-sm">
                  <div>
                    <div class="flex items-start justify-between">
                      <div>
                        <div class="text-sm sm:text-base font-black font-hanzi text-white">
                          ${qIdx + 1}. ${q.q_hz}
                        </div>
                        <div class="text-xs font-mono text-sky-400 font-bold mt-0.5">
                          ${q.py}
                        </div>
                      </div>
                      <button onclick="speakChinese('${q.q_hz}')" class="p-1.5 rounded-lg bg-slate-700 hover:bg-sky-600 text-slate-300 hover:text-white transition shrink-0 ml-2" title="Sebut Soalan">
                        🔊
                      </button>
                    </div>

                    <!-- 4 Options (Hanzi + Pinyin ONLY) -->
                    <div class="mt-2.5 space-y-1.5">
                      ${q.options.map((opt, oIdx) => `
                        <button id="compre-btn-${qIdx}-${oIdx}" 
                                onclick="checkCompreOption(${qIdx}, ${oIdx}, ${opt.correct ? 'true' : 'false'}, '${opt.hz}')"
                                class="compre-btn w-full p-2 rounded-xl bg-slate-900/80 hover:bg-slate-700/80 border border-slate-700/70 text-left transition flex items-center justify-between">
                          <div>
                            <span class="font-bold text-xs text-slate-400 mr-1.5">${['A', 'B', 'C', 'D'][oIdx]}</span>
                            <span class="font-hanzi font-bold text-xs sm:text-sm text-white">${opt.hz}</span>
                            <span class="font-mono text-[11px] text-sky-300 ml-1.5 font-medium">(${opt.py})</span>
                          </div>
                          <span id="compre-icon-${qIdx}-${oIdx}" class="text-xs"></span>
                        </button>
                      `).join('')}
                    </div>

                    <!-- Hidden Scheme -->
                    <div id="compre-ans-${qIdx}" class="hidden mt-2 p-2 rounded-xl bg-indigo-950/50 border border-indigo-700/50 text-xs">
                      <div class="font-bold text-amber-300 font-hanzi">💡 Skema Jawapan:</div>
                      <div class="text-white font-hanzi mt-0.5">${q.explain}</div>
                    </div>
                  </div>

                  <div class="mt-2.5 pt-2 border-t border-slate-700/50 flex justify-end">
                    <button id="compre-toggle-${qIdx}" onclick="toggleCompreAns(${qIdx})" class="text-xs text-slate-400 hover:text-white font-bold flex items-center space-x-1">
                      <span>👁️ Dedahkan Skema Guru</span>
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      viewport.innerHTML = contentHtml;
    }

    // ==========================================
    // INNER RENDERERS & HANDLERS
    // ==========================================
    function selectVocabWord(hz, idx) {
      const slide = SLIDES[currentSlideIdx];
      const word = slide.words.find(w => w.hz === hz);
      if (!word) return;

      currentVocabWord = word;
      document.querySelectorAll('.vcard').forEach(c => c.classList.remove('ring-2', 'ring-indigo-500', 'bg-indigo-950/30'));
      const activeCard = document.getElementById(`vcard-${idx}`);
      if (activeCard) activeCard.classList.add('ring-2', 'ring-indigo-500', 'bg-indigo-950/30');

      document.getElementById('vocab-sent-hz').textContent = word.exHz;
      document.getElementById('vocab-sent-py').textContent = word.exPy;
      document.getElementById('vocab-sent-my').textContent = `Maksud: "${word.exMy}"`;
      document.getElementById('btn-vocab-sent-audio').setAttribute('onclick', `speakChinese('${word.exHz}')`);
      speakChinese(word.hz);
    }

    // Game 1 Drag & Drop Handlers
    function handleDragStart(e, hz, idx) {
      e.dataTransfer.setData('text/plain', JSON.stringify({ hz, idx }));
      selectedChip = { hz, idx };
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-target-hover');
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-target-hover');
    }

    function handleDrop(e, targetIdx, targetHz) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-target-hover');
      try {
        const data = JSON.parse(e.dataTransfer.getData('text/plain'));
        validateMatch(data.hz, targetHz, data.idx, targetIdx);
      } catch (err) {}
    }

    function selectChipToPlace(hz, idx) {
      selectedChip = { hz, idx };
      document.querySelectorAll('.word-chip').forEach(c => c.classList.remove('ring-2', 'ring-amber-400', 'scale-105'));
      const el = document.getElementById(`chip-${idx}`);
      if (el) el.classList.add('ring-2', 'ring-amber-400', 'scale-105');
      speakChinese(hz);
    }

    function clickTargetSlot(targetIdx, targetHz) {
      if (selectedChip) {
        validateMatch(selectedChip.hz, targetHz, selectedChip.idx, targetIdx);
      }
    }

    function validateMatch(chipHz, targetHz, chipIdx, targetIdx) {
      const slotEl = document.getElementById(`target-slot-${targetIdx}`);
      const dropzone = document.getElementById(`slot-dropzone-${targetIdx}`);
      const chipEl = document.getElementById(`chip-${chipIdx}`);

      if (chipHz === targetHz) {
        matchedItems[targetIdx] = true;
        dropzone.className = "w-full mt-1.5 py-1 px-1 rounded-xl bg-emerald-600 text-white text-center font-black text-xs shadow";
        dropzone.innerHTML = `<span>✓ ${chipHz}</span>`;
        if (chipEl) chipEl.style.display = 'none';
        speakChinese(chipHz);
        checkAllMatched();
      } else {
        slotEl.classList.add('shake-anim');
        setTimeout(() => slotEl.classList.remove('shake-anim'), 400);
      }
      selectedChip = null;
      document.querySelectorAll('.word-chip').forEach(c => c.classList.remove('ring-2', 'ring-amber-400', 'scale-105'));
    }

    function checkAllMatched() {
      const slide = SLIDES[currentSlideIdx];
      const count = Object.keys(matchedItems).length;
      document.getElementById('match-counter').textContent = `${count} / ${slide.items.length} Selesai`;
      if (count === slide.items.length) {
        document.getElementById('match-win-banner').classList.remove('hidden');
      }
    }

    function revealAllMatches() {
      const slide = SLIDES[currentSlideIdx];
      slide.items.forEach((it, idx) => {
        matchedItems[idx] = true;
        const dropzone = document.getElementById(`slot-dropzone-${idx}`);
        if (dropzone) {
          dropzone.className = "w-full mt-1.5 py-1 px-1 rounded-xl bg-indigo-600 text-white text-center font-black text-xs shadow";
          dropzone.innerHTML = `<span>✓ ${it.hz}</span>`;
        }
        const chip = document.getElementById(`chip-${idx}`);
        if (chip) chip.style.display = 'none';
      });
      checkAllMatched();
    }

    function resetMatchGame() {
      renderSlide();
    }

    // Game 2 Listen Handlers
    function checkListenChoice(itIdx, optIdx, isCorrect, targetHz) {
      const btn = document.getElementById(`listen-btn-${itIdx}-${optIdx}`);
      if (isCorrect) {
        btn.className = "listen-opt-btn p-2 rounded-xl bg-emerald-600 border border-emerald-400 text-white font-black text-center shadow";
        listenSelected[itIdx] = 10;
        speakChinese(targetHz);
      } else {
        btn.className = "listen-opt-btn p-2 rounded-xl bg-rose-600 border border-rose-400 text-white font-black text-center shadow";
        listenSelected[itIdx] = 0;
      }
      const totalScore = Object.values(listenSelected).reduce((a, b) => a + b, 0);
      const slide = SLIDES[currentSlideIdx];
      document.getElementById('listen-score').textContent = `⭐ Skor: ${totalScore} / ${slide.items.length * 10}`;
    }

    // Game 3 Quiz Renderer & Handlers
    function renderQuizInnerHtml(slide) {
      const q = slide.questions[quizCurrentIdx];
      const totalQ = slide.questions.length;
      return `
        <div class="h-full flex flex-col justify-between">
          <div class="border-b border-slate-800 pb-2 mb-3 flex items-center justify-between">
            <div>
              <span class="text-xs font-black uppercase tracking-wider text-amber-400">${slide.tag}</span>
              <h2 class="text-lg sm:text-xl font-outfit font-black text-white">${slide.title}</h2>
            </div>
            <div class="flex items-center space-x-2">
              <span class="px-3 py-1 rounded-xl bg-amber-950/80 border border-amber-700/60 text-amber-400 font-mono text-xs font-black">
                ⭐ Markah: ${quizScore} / 100
              </span>
              <span class="px-2.5 py-1 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs">
                Soalan ${quizCurrentIdx + 1} / ${totalQ}
              </span>
            </div>
          </div>

          <!-- Question Box -->
          <div class="flex-1 flex flex-col justify-center max-w-3xl mx-auto w-full my-auto">
            <div class="p-4 sm:p-5 rounded-3xl bg-slate-800/90 border border-slate-700 shadow-xl mb-4">
              <div class="text-[10px] font-black uppercase tracking-wider text-indigo-400 bg-indigo-950/80 px-2.5 py-1 rounded-lg inline-block mb-2 border border-indigo-800/40">
                Cabaran Soalan ${quizCurrentIdx + 1}
              </div>
              <div class="text-base sm:text-lg font-black text-white leading-relaxed">
                ${q.q}
              </div>
            </div>

            <!-- 4 Options -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
              ${q.options.map((opt, oIdx) => `
                <button id="quiz-btn-${oIdx}" 
                        onclick="answerQuizQuestion(${oIdx}, ${q.ans})" 
                        class="quiz-opt-btn p-3 rounded-2xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 hover:border-indigo-500 text-left transition flex items-center space-x-3 active:scale-95 shadow">
                  <span class="w-7 h-7 rounded-full bg-slate-900 text-slate-300 font-black text-xs flex items-center justify-center shrink-0 border border-slate-700">
                    ${['A', 'B', 'C', 'D'][oIdx]}
                  </span>
                  <span class="text-xs sm:text-sm font-bold text-slate-200 leading-snug">${opt}</span>
                </button>
              `).join('')}
            </div>

            <!-- Feedback & Next Button -->
            <div id="quiz-feedback-box" class="hidden p-3 rounded-2xl bg-slate-800/90 border border-slate-700 flex items-center justify-between">
              <div id="quiz-feedback-text" class="text-xs font-bold"></div>
              <button onclick="nextQuizQuestion()" class="px-4 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs shadow transition">
                Soalan Seterusnya ➡️
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function answerQuizQuestion(selectedIdx, correctIdx) {
      if (quizAnswered[quizCurrentIdx] !== undefined) return;
      quizAnswered[quizCurrentIdx] = selectedIdx;

      const q = SLIDES[currentSlideIdx].questions[quizCurrentIdx];
      const isCorrect = (selectedIdx === correctIdx);
      if (isCorrect) {
        quizScore += 10;
        document.getElementById(`quiz-btn-${selectedIdx}`).className = "quiz-opt-btn p-3 rounded-2xl bg-emerald-600 border border-emerald-400 text-white text-left transition flex items-center space-x-3 shadow";
      } else {
        document.getElementById(`quiz-btn-${selectedIdx}`).className = "quiz-opt-btn p-3 rounded-2xl bg-rose-600 border border-rose-400 text-white text-left transition flex items-center space-x-3 shadow";
        document.getElementById(`quiz-btn-${correctIdx}`).className = "quiz-opt-btn p-3 rounded-2xl bg-emerald-600 border border-emerald-400 text-white text-left transition flex items-center space-x-3 shadow";
      }

      const fbBox = document.getElementById('quiz-feedback-box');
      const fbText = document.getElementById('quiz-feedback-text');
      fbBox.classList.remove('hidden');
      if (isCorrect) {
        fbText.className = "text-emerald-400 text-xs font-black";
        fbText.textContent = "🎉 TEPAT SEKALI! (+10 Markah)";
      } else {
        fbText.className = "text-rose-400 text-xs font-black";
        fbText.textContent = `❌ Kurang Tepat. Jawapan Betul: ${['A', 'B', 'C', 'D'][correctIdx]} (${q.hint || ''})`;
      }
    }

    function nextQuizQuestion() {
      const slide = SLIDES[currentSlideIdx];
      if (quizCurrentIdx < slide.questions.length - 1) {
        quizCurrentIdx++;
        document.getElementById('slide-content').innerHTML = renderQuizInnerHtml(slide);
      } else {
        alert(`Tahniah! Kuiz Selesai! Skor Akhir Pelajar: ${quizScore} / 100 ⭐`);
      }
    }

    // Sentence Practice Handler
    function toggleSentenceAns(idx) {
      const el = document.getElementById(`sent-ans-${idx}`);
      const btn = document.getElementById(`sent-btn-${idx}`);
      if (el.classList.contains('hidden')) {
        el.classList.remove('hidden');
        btn.textContent = '🙈 Sembunyikan Skema';
      } else {
        el.classList.add('hidden');
        btn.textContent = '👁️ Dedahkan Skema Jawapan Guru';
      }
    }

    // Comprehension Option Handler
    function checkCompreOption(qIdx, oIdx, isCorrect, targetHz) {
      const btn = document.getElementById(`compre-btn-${qIdx}-${oIdx}`);
      const icon = document.getElementById(`compre-icon-${qIdx}-${oIdx}`);
      if (isCorrect) {
        btn.className = "compre-btn w-full p-2 rounded-xl bg-emerald-600 border border-emerald-400 text-white text-left transition flex items-center justify-between shadow";
        icon.textContent = "✓ TEPAT";
        speakChinese(targetHz);
      } else {
        btn.className = "compre-btn w-full p-2 rounded-xl bg-rose-600 border border-rose-400 text-white text-left transition flex items-center justify-between shadow";
        icon.textContent = "✗ SALAH";
      }
    }

    function toggleCompreAns(qIdx) {
      const el = document.getElementById(`compre-ans-${qIdx}`);
      const btn = document.getElementById(`compre-toggle-${qIdx}`);
      if (el.classList.contains('hidden')) {
        el.classList.remove('hidden');
        btn.textContent = '🙈 Sembunyikan Skema';
      } else {
        el.classList.add('hidden');
        btn.textContent = '👁️ Dedahkan Skema Guru';
      }
    }

    // Roleplay & Dialogue BM & Pinyin Toggle Handlers
    let isBmHidden = true; // Hidden by default!
    function toggleBmTranslation() {
      isBmHidden = !isBmHidden;
      const label = isBmHidden ? '👁️ Tunjuk Maksud BM' : '🙈 Sembunyi Maksud BM';
      const b1 = document.getElementById('rf-my-dlg');
      const b2 = document.getElementById('rf-my-rp');
      if (b1) b1.innerHTML = `<span>${label}</span>`;
      if (b2) b2.innerHTML = `<span>${label}</span>`;
      document.querySelectorAll('.dlg-my, .rp-my').forEach(el => {
        el.style.display = isBmHidden ? 'none' : 'block';
      });
    }

    function togglePinyinRoleplay() {
      isRoleplayPinyinHidden = !isRoleplayPinyinHidden;
      document.getElementById('rf-pinyin').textContent = isRoleplayPinyinHidden ? '👁️ Tunjuk Pinyin' : '👁️ Sembunyi Pinyin';
      document.querySelectorAll('.rp-pinyin').forEach(p => {
        p.style.display = isRoleplayPinyinHidden ? 'none' : 'block';
      });
    }

    function playDialogueAudio(topic, dIdx, lIdx, text, role) {
      if (currentAudioObj) {
        currentAudioObj.pause();
        currentAudioObj.currentTime = 0;
      }
      const tNum = topic || currentTopicNum || 1;
      const audioPath = `audio/dialogues/t${tNum}_d${dIdx}_l${lIdx}.mp3`;
      const audio = new Audio(audioPath);
      currentAudioObj = audio;
      audio.playbackRate = audioRate;
      audio.play().catch(err => {
        console.log("Audio file play fallback to SpeechSynthesis:", err);
        speakChinese(text, role);
      });
    }

    function playAllDialogueRoleplay() {
      const slide = SLIDES[currentSlideIdx];
      if (!slide || !slide.dialogues) return;
      
      const allLines = [];
      const tNum = slide.topic_num || currentTopicNum || 1;
      slide.dialogues.forEach((dlg, dIdx) => {
        dlg.lines.forEach((l, lIdx) => {
          const isA = (lIdx % 2 === 0);
          allLines.push({
            id: `rp-line-${dIdx}-${lIdx}`,
            hz: l.hz,
            tNum: tNum,
            dIdx: dIdx,
            lIdx: lIdx,
            roleVoice: isA ? 'male' : 'female'
          });
        });
      });

      if (currentAudioObj) {
        currentAudioObj.pause();
        currentAudioObj.currentTime = 0;
      }

      let pIdx = 0;
      function playNext() {
        if (pIdx >= allLines.length) {
          document.querySelectorAll('.rp-line').forEach(el => el.classList.remove('ring-4', 'ring-amber-400', 'bg-amber-950/60'));
          return;
        }
        document.querySelectorAll('.rp-line').forEach(el => el.classList.remove('ring-4', 'ring-amber-400', 'bg-amber-950/60'));
        const item = allLines[pIdx];
        const activeEl = document.getElementById(item.id);
        if (activeEl) {
          activeEl.classList.add('ring-4', 'ring-amber-400', 'bg-amber-950/60');
          activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        const audioPath = `audio/dialogues/t${item.tNum}_d${item.dIdx}_l${item.lIdx}.mp3`;
        const audio = new Audio(audioPath);
        currentAudioObj = audio;
        audio.playbackRate = audioRate;
        
        audio.onended = () => {
          pIdx++;
          setTimeout(playNext, 600);
        };
        audio.onerror = () => {
          speakChinese(item.hz, item.roleVoice);
          pIdx++;
          setTimeout(playNext, 2500);
        };
        audio.play().catch(e => {
          speakChinese(item.hz, item.roleVoice);
          pIdx++;
          setTimeout(playNext, 2500);
        });
      }
      playNext();
    }

    // Keyboard Navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'Backspace') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      }
    });

    // Initial Load
    renderSlide();
  </script>
</body>
</html>
